<div class="mb-3">
    <label for="title" class="form-label">Title *</label>
    <input type="text" class="form-control" id="title" name="title" required 
           placeholder="e.g. Nike Air Max" autofocus>
</div>

<div class="mb-3">
    <label for="price" class="form-label">Price (€) *</label>
    <input type="number" class="form-control" id="price" name="price" 
           step="0.01" min="0" required placeholder="0.00">
</div>

<div class="mb-3">
    <label for="wait_days" class="form-label">Wait Time *</label>
    <select class="form-select" id="wait_days" name="wait_days" required>
        <option value="1">1 day (24 hours)</option>
        <option value="7" selected>7 days (1 week)</option>
        <option value="30">30 days (1 month)</option>
        <option value="90">90 days (3 months)</option>
    </select>
</div>

<div class="mb-3">
    <label for="category" class="form-label">Category</label>
    <input type="text" class="form-control" id="category" name="category" 
           list="categories" placeholder="e.g. Electronics, Clothing, Sports">
    <datalist id="categories">
        <option value="Electronics">
        <option value="Clothing">
        <option value="Sports">
        <option value="Home">
        <option value="Books">
        <option value="Games">
    </datalist>
</div>

<div class="mb-3">
    <label for="link" class="form-label">Link</label>
    <input type="url" class="form-control" id="link" name="link" 
           placeholder="https://...">
</div>

<div class="mb-3">
    <label for="notes" class="form-label">Notes</label>
    <textarea class="form-control" id="notes" name="notes" rows="2" 
              placeholder="Why do I want to buy this?"></textarea>
</div>
